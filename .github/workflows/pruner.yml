name: Pruner - Automated Dependency Pruning

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Depcheck
        run: npx depcheck
