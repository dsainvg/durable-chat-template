name: Reaper - Dead Code Detection

on:
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run Knip
        run: npx knip
