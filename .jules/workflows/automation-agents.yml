name: Automation Agents

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * *"

jobs:
  shield:
    name: Security Vulnerability Scanner (Agent 'Shield')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Run npm audit
        run: npm audit
        continue-on-error: true

  coverage:
    name: Test-Coverage Drift Monitor (Agent 'Coverage')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run vitest coverage
        run: npx vitest run --coverage
        continue-on-error: true

  pruner_trim:
    name: Automated Dependency Pruner (Agent 'Trim')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run depcheck
        run: npx depcheck src/
        continue-on-error: true
